[project]
name = "topodata-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.133.1",
    "gps-time>=3.0.0",
    "pandas>=3.0.1",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "pyproj>=3.7.2",
    "sqlalchemy>=2.0.47",
]

[tool.ruff.lint]
ignore = ["RUF032"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
